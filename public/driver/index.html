<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#cf0a2c"><title>AKFIX — Водитель</title><link rel="stylesheet" href="/driver/driver.css"><link rel="stylesheet" href="/driver/driver-fix.css"></head><body>
<div id="boot" class="app-boot" aria-label="Загрузка приложения"><img src="/assets/logo.svg" alt="AKFIX"><span></span></div>
<main id="login" class="login" hidden><form id="loginForm" class="login-card"><img src="/assets/logo.svg" alt="AKFIX"><h1>Вход в приложение</h1><p>Для сборщиков и водителей используется одна учётная запись.</p><label>Логин<input id="loginInput" autocomplete="username" required></label><label>PIN-код<input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" required></label><div id="loginError" class="error"></div><button class="primary">Войти</button></form></main>
<main id="app" hidden><header><img src="/assets/logo.svg" alt="AKFIX"><div><b id="userName"></b><small>Водитель</small></div><button id="logout" class="logout-button" aria-label="Выйти из приложения"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M18 12H9"/></svg><span>Выйти</span></button></header><section id="listScreen" class="screen"><div class="title"><div><h1>Мои рейсы</h1><p id="sync">Назначения из таблицы «Отгрузки»</p></div><button id="refresh" class="refresh" aria-label="Обновить">↻</button></div><div class="tabs"><button data-filter="active" class="active">Сегодня</button><button data-filter="tomorrow">Завтра</button><button data-filter="done">Завершённые</button><button data-filter="history">История</button></div><label id="historyCalendar" class="calendar" hidden><span>Дата рейса</span><input id="historyDate" type="date"></label><div id="orders" class="orders"><div class="empty">Загрузка…</div></div></section><section id="detailScreen" class="screen" hidden><button id="back" class="back">← К рейсам</button><div id="detail"></div></section></main><div id="toast"></div><script src="/driver/driver.js?v=23"></script></body></html>
