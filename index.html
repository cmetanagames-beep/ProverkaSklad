  </section>
  <section class="screen with-rail" data-screen="setup">
    <div class="rail"><span class="done">✓</span><span class="done">✓</span><span class="on">3</span><span>4</span></div>
    <div class="steps"><span class="step done" data-n="1">Склад</span><span class="step on" data-n="2">Палеты</span><span class="step" data-n="3">Выбор</span><span class="step" data-n="4">Фото</span></div>
    <h1>Мой склад и палеты</h1><p class="sub">Проверка этого склада выгружается отдельно и не ждёт второй склад.</p>
    <div class="section-label">Текущий сотрудник</div><div class="employee-card"><div class="user" id="employeeInitial">Е</div><div><b id="employeeName">Евгений</b><small id="employeeWarehouse">Склад Мытищи</small></div><button class="switch-user" id="switchUser">Сменить</button></div>
    <div class="counters" id="counters"><div class="section-label">Европалеты</div><div class="counter"><button data-count="euro" data-delta="-1">−</button><strong id="euro">1</strong><button data-count="euro" data-delta="1">＋</button></div>
    <div class="section-label">Американские палеты</div><div class="counter"><button data-count="american" data-delta="-1">−</button><strong id="american">0</strong><button data-count="american" data-delta="1">＋</button></div>
    <div class="total"><b>Итого палет</b><strong id="total">1</strong></div><div class="tip amber"><span class="tip-icon">i</span><span><b>Какая палета считается европейской?</b><small>Европалета — 1200×800 мм. Американская — 1200×1000 или 1200×1200 мм.</small></span></div></div>
    <div class="sticky"><button class="primary" id="toPallets">Продолжить</button></div>
  </section>
  <section class="screen with-rail" data-screen="pallets">
    <div class="rail"><span class="done">✓</span><span class="done">✓</span><span class="done">✓</span><span class="on">4</span></div>
    <div class="steps"><span class="step done" data-n="1">Склад</span><span class="step done" data-n="2">Палеты</span><span class="step on" data-n="3">Выбор</span><span class="step" data-n="4">Фото</span></div>
    <h1>Выберите палету</h1><p class="sub">Открывайте палеты вручную. Для каждой требуется три фотографии.</p>
    <div class="tip" id="palletCoach"><span class="tip-icon">1</span><span><b>С чего начать?</b><small>Нажмите на палету, которую фотографируете сейчас. После фото вы вернётесь в этот список.</small></span><button class="tip-close" id="closeCoach">×</button></div>
    <div class="pallet-list" id="pallets"></div>
    <div class="sticky"><button class="primary" id="finish" disabled>Выгрузить фото</button><p class="note">Проверка этого склада отправится сразу в Bitrix24 и Telegram</p></div>
  </section>
  <section class="screen" data-screen="capture">
    <div class="steps"><span class="step done" data-n="1">Склад</span><span class="step done" data-n="2">Палеты</span><span class="step done" data-n="3">Выбор</span><span class="step on" data-n="4">Фото</span></div>
    <div class="capture-head"><div><h1 id="captureTitle">Палета 1</h1><span class="stage" id="captureType">Европалета</span></div><div class="big-progress" id="captureProgress">0/3</div></div>
    <p class="sub">Сделайте три фотографии палеты целиком.</p><div class="capture-list" id="captureList"></div><div class="tip amber"><span class="tip-icon">!</span><span><b>Палета должна быть видна целиком</b><small>Не обрезайте края и снимайте при хорошем освещении.</small></span></div><button class="secondary" data-help>Как фотографировать?</button>
    <div class="sticky"><button class="primary" id="savePallet" disabled>Сохранить палету</button><p class="why" id="saveWhy">Добавьте все 3 фотографии</p></div>
  </section>
  <section class="screen" data-screen="success"><div class="success"><div class="success-icon">✓</div><h1>Проверка готова</h1><p class="sub">Прототип собрал все данные. Рабочая версия отправит фотографии в Bitrix24 и Telegram.</p><div class="summary" id="summary"></div><button class="secondary" id="again">Вернуться к заказам</button></div></section>
</main>
<div class="toast" id="toast"></div>
<div class="modal" id="helpModal"><section class="sheet"><div class="sheet-head"><h2>Как работать</h2><button class="sheet-close" id="closeHelp">×</button></div><div class="help-list"><div class="help-row"><i>1</i><span><b>Выберите заказ</b><small>Откройте нужный номер из списка Bitrix24.</small></span></div><div class="help-row"><i>2</i><span><b>Проверьте свой склад</b><small>Если товара нет — отметьте это. Если есть — укажите особые товары и палеты.</small></span></div><div class="help-row"><i>3</i><span><b>Снимите каждую палету</b><small>Первый угол, второй угол и вид сверху. Палета в кадре целиком.</small></span></div><div class="help-row"><i>4</i><span><b>Выгрузите результат</b><small>В рабочей версии фото отправятся в Bitrix24 и Telegram сразу для вашего склада.</small></span></div></div><button class="primary" id="understood">Понятно</button></section></div>
<script>
  const WEBHOOK='/api/bitrix/';
  const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];
  const app={screen:'orders',order:null,user:{name:'Евгений',warehouse:'Мытищи'},noCargo:false,euro:1,american:0,special:{b:false,p:false,photos:{}},pallets:[],current:null,orders:[]};
  const demo=['АФУТ-003350','АФУТ-003349','АФУТ-003348','АФУТ-003347','АФУТ-003346'].map((title,i)=>({id:3350-i,title,updated:`0${9-i}:35`}));
  function show(name){app.screen=name;qa('.screen').forEach(x=>x.classList.toggle('active',x.dataset.screen===name));renderTop(name);scrollTo(0,0)}
  function orderNumber(title=''){return title.match(/АФУТ-\d+/i)?.[0]||title.slice(0,24)}
  function displayOrderTitle(title=''){const numbers=title.match(/АФУТ-\d+/gi)||[];if(!numbers.length)return title;if(/добавк/i.test(title)&&numbers.length>1)return `${numbers[0]} добавка к ${numbers[1]}`;return numbers[0]}
  function renderTop(name){const top=q('#top');if(name==='orders'||name==='success'){top.innerHTML=`<div class="logo">AKFIX</div><button class="head-user" data-help aria-label="Инструкция"><span>${app.user.name[0]}</span><b>${app.user.name}</b><i>⌄</i></button>`;wireHelp();return}const labels={special:'Проверка склада',setup:'Склад и палеты',pallets:'Палеты',capture:'Фото палеты'};top.innerHTML=`<button class="back" aria-label="Назад">‹</button><div class="top-title"><b>${labels[name]}</b><small>${orderNumber(app.order?.title)} · Передан на сборку</small></div><button class="help-btn" data-help aria-label="Помощь">?</button>`;q('.back').onclick=()=>show({special:'orders',setup:'special',pallets:'setup',capture:'pallets'}[name]);wireHelp()}
  function orderRows(rows){q('#orders').innerHTML=rows.length?rows.map(o=>`<button class="order" data-order="${o.id}"><span class="order-icon">▤</span><span><b>${displayOrderTitle(o.title)}</b><small>Передан на сборку</small></span><span class="chev">›</span></button>`).join(''):'<div class="empty">Заказы не найдены</div>';qa('[data-order]').forEach(b=>b.onclick=()=>{app.order=app.orders.find(o=>String(o.id)===b.dataset.order);show('special')})}
  async function loadOrders(){app.orders=demo;orderRows(app.orders);try{const form=new URLSearchParams();form.set('entityTypeId','1052');form.set('filter[categoryId]','31');form.set('select[0]','id');form.set('select[1]','title');form.set('select[2]','stageId');form.set('select[3]','updatedTime');form.set('start','0');const stages=await fetch(WEBHOOK+'crm.status.list.json',{method:'POST',body:new URLSearchParams({'filter[ENTITY_ID]':'DYNAMIC_1052_STAGE_31'})}).then(r=>r.json());const stage=(stages.result||[]).find(s=>/передан.{0,18}сбор/i.test(s.NAME));if(!stage)throw 0;form.set('filter[stageId]',stage.STATUS_ID);const data=await fetch(WEBHOOK+'crm.item.list.json',{method:'POST',body:form}).then(r=>r.json());const items=data.result?.items||[];if(items.length)app.orders=items.map(x=>({id:x.id,title:x.title||`Заказ ${x.id}`,updated:new Date(x.updatedTime||Date.now()).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}));q('#syncText').textContent=`Bitrix24 · обновлено ${new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}`}catch(e){q('#syncText').textContent='Демо-данные · Bitrix24 недоступен'}orderRows(app.orders)}
  q('#search').oninput=e=>orderRows(app.orders.filter(o=>o.title.toLowerCase().includes(e.target.value.toLowerCase())));
  function syncChoices(changed){if(changed==='none'&&q('#hasNone').checked){q('#hasB').checked=q('#hasP').checked=false}if(changed!=='none'&&(q('#hasB').checked||q('#hasP').checked))q('#hasNone').checked=false;if(!q('#hasB').checked&&!q('#hasP').checked)q('#hasNone').checked=true;app.special.b=q('#hasB').checked;app.special.p=q('#hasP').checked;qa('.choice').forEach(x=>x.classList.toggle('selected',x.querySelector('input').checked));renderSpecialPhotos()}
  ['hasB','hasP','hasNone'].forEach(id=>q('#'+id).onchange=()=>syncChoices(id==='hasNone'?'none':id));
  function specialSlot(key,title,sub){const has=app.special.photos[key];return `<label class="photo-slot ${has?'has':''}"><span class="camera">${has?'✓':''}</span><span><b>${title}</b><small>${has?'Фото добавлено':sub}</small></span><input type="file" accept="image/*" capture="environment" data-special="${key}"></label>`}
  function renderSpecialPhotos(){let html='';if(app.special.b)html+=specialSlot('bBox','Б: состояние коробки','Снимите коробку крупным планом')+specialSlot('bInside','Б: товар внутри','Откройте коробку и снимите товар');if(app.special.p)html+=specialSlot('pMark','П: маркировка и срок','Текст должен хорошо читаться')+specialSlot('pInside','П: товар внутри','Откройте коробку и снимите товар');q('#specialPhotos').innerHTML=html;qa('[data-special]').forEach(x=>x.onchange=()=>{if(x.files[0])app.special.photos[x.dataset.special]=x.files[0];renderSpecialPhotos()});validateSpecial()}
  function validateSpecial(){const needed=[...(app.special.b?['bBox','bInside']:[]),...(app.special.p?['pMark','pInside']:[])];q('#toSetup').disabled=!app.noCargo&&needed.some(k=>!app.special.photos[k])}
  function renderUser(){if(q('#employeeInitial'))q('#employeeInitial').textContent=app.user.name[0];if(q('#employeeName'))q('#employeeName').textContent=app.user.name;if(q('#employeeWarehouse'))q('#employeeWarehouse').textContent='Склад '+app.user.warehouse;q('#noCargoEarlyTitle').childNodes[0].textContent=`На складе ${app.user.warehouse} товара нет`;q('#noCargoEarlyText').textContent='Зафиксировать отсутствие товара и выгрузить результат без фотографий.';q('#warehouseTip').textContent=`Проверяем склад ${app.user.warehouse}`;if(q('#listInitial'))q('#listInitial').textContent=app.user.name[0];if(q('#listEmployee'))q('#listEmployee').textContent=app.user.name;if(q('#listWarehouse'))q('#listWarehouse').textContent=app.user.warehouse;renderTop(app.screen)}
  function switchUser(){app.user=app.user.warehouse==='Мытищи'?{name:'Сергей',warehouse:'Балашиха'}:{name:'Евгений',warehouse:'Мытищи'};app.noCargo=false;q('#noCargoEarly').checked=false;q('#specialContent').hidden=false;q('#toSetup').textContent='Продолжить';renderUser();toast(`Выполнен вход: ${app.user.name}, склад ${app.user.warehouse}`)}
  q('#toSetup').onclick=()=>{if(app.noCargo){finishWarehouse(true);return}renderUser();show('setup')};
  q('#switchUser').onclick=switchUser;q('#listSwitch').onclick=switchUser;
  q('#noCargoEarly').onchange=e=>{app.noCargo=e.target.checked;q('#specialContent').hidden=app.noCargo;q('#toSetup').textContent=app.noCargo?'Выгрузить «Товара нет»':'Продолжить';validateSpecial()};
  qa('[data-count]').forEach(b=>b.onclick=()=>{const key=b.dataset.count;app[key]=Math.max(0,app[key]+Number(b.dataset.delta));q('#'+key).textContent=app[key];q('#total').textContent=app.euro+app.american;q('#toPallets').disabled=app.euro+app.american===0});
  function buildPallets(){const old=new Map(app.pallets.map(p=>[p.type+p.typeIndex,p]));app.pallets=[];for(const [type,n] of [['Европалета',app.euro],['Американская палета',app.american]])for(let i=1;i<=n;i++)app.pallets.push(old.get(type+i)||{id:app.pallets.length+1,type,typeIndex:i,photos:{}});renderPallets()}
  q('#toPallets').onclick=()=>{buildPallets();show('pallets')};
  function renderPallets(){q('#pallets').innerHTML=app.pallets.map((p,i)=>{const n=Object.keys(p.photos).length;return `<button class="pallet ${n===3?'done':''}" data-pallet="${i}"><span class="pallet-icon">▱</span><span><b>${p.type}</b><small>Палета ${i+1}</small><span class="progress">${[0,1,2].map(k=>`<i class="${k<n?'on':''}"></i>`).join('')}</span></span><span class="pallet-count">${n}/3 ›</span></button>`}).join('');qa('[data-pallet]').forEach(b=>b.onclick=()=>openPallet(Number(b.dataset.pallet)));q('#finish').disabled=!app.pallets.length||app.pallets.some(p=>Object.keys(p.photos).length<3)}
  function openPallet(i){app.current=i;const p=app.pallets[i];q('#captureTitle').textContent=`Палета ${i+1}`;q('#captureType').textContent=p.type;renderCapture();show('capture')}
  const shots=[['angle1','Первый угол','Палета целиком с первого угла'],['angle2','Второй угол','Палета целиком с противоположного угла'],['top','Сверху','Сверху видна вся палета']];
  function renderCapture(){const p=app.pallets[app.current],n=Object.keys(p.photos).length;q('#captureProgress').textContent=`${n}/3`;q('#captureList').innerHTML=shots.map((s,i)=>`<div class="capture-wrap"><span class="number">${i+1}</span><label class="photo-slot ${p.photos[s[0]]?'has':''}"><span class="camera">${p.photos[s[0]]?'✓':''}</span><span><b>${s[1]}</b><small>${p.photos[s[0]]?'Фото добавлено':s[2]}</small></span><input type="file" accept="image/*" capture="environment" data-shot="${s[0]}"></label></div>`).join('');qa('[data-shot]').forEach(x=>x.onchange=()=>{if(x.files[0])p.photos[x.dataset.shot]=x.files[0];renderCapture()});q('#savePallet').disabled=n<3;q('#saveWhy').textContent=n<3?`Добавьте ещё ${3-n} ${3-n===1?'фотографию':'фотографии'}`:'Все фотографии добавлены'}
  q('#savePallet').onclick=()=>{show('pallets');renderPallets();toast('Палета сохранена. Выберите следующую вручную.')};
  function finishWarehouse(noCargo=false){const photos=noCargo?0:app.pallets.length*3+Object.keys(app.special.photos).length;q('#summary').innerHTML=`<div><span>Заказ</span><b>${orderNumber(app.order.title)}</b></div><div><span>Склад</span><b>${app.user.warehouse}</b></div><div><span>Проверил</span><b>${app.user.name}</b></div>${noCargo?'<div><span>Результат</span><b>Товара нет</b></div>':`<div><span>Европалеты</span><b>${app.euro}</b></div><div><span>Американские</span><b>${app.american}</b></div><div><span>Фотографии</span><b>${photos}</b></div>`}`;q('.success .sub').textContent=noCargo?`Отметка «На складе ${app.user.warehouse} товара нет» готова к отдельной выгрузке. Второй склад продолжает работу независимо.`:`Фото склада ${app.user.warehouse} готовы к отдельной выгрузке. Второй склад продолжает работу независимо.`;show('success')}
  q('#finish').onclick=()=>finishWarehouse(false);
  q('#again').onclick=()=>location.reload();function toast(t){q('#toast').textContent=t;q('#toast').classList.add('show');setTimeout(()=>q('#toast').classList.remove('show'),2300)}
  function wireHelp(){qa('[data-help]').forEach(b=>b.onclick=()=>q('#helpModal').classList.add('show'))}q('#closeHelp').onclick=q('#understood').onclick=()=>q('#helpModal').classList.remove('show');q('#helpModal').onclick=e=>{if(e.target===q('#helpModal'))q('#helpModal').classList.remove('show')};q('#closeCoach').onclick=()=>q('#palletCoach').remove();
  wireHelp();renderSpecialPhotos();loadOrders();
</script>
</body>
</html>
